# Manage the switch-facing and node-facing DSA user ports, not the CPU conduit.
configure system interface pattern ge*,node*

# Use the MAC address as port ID; the interface name is sent as the port
# description.
configure lldp portidsubtype macaddress
configure system bond-slave-src-mac-type real

# Advertise on one uplink only. UniFi records the clients of a LAG on the LAG's
# first switch port and nests them under an LLDP neighbor only if that neighbor
# is seen on the same port and no other. ge1 must be the uplink wired to the
# lower-numbered switch port; see docs/lldp.md.
configure ports ge0 lldp status rx-only
