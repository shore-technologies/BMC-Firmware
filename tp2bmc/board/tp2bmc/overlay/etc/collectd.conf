# collectd configuration for the Turing Pi 2 BMC.
# See docs/monitoring.md in the BMC-Firmware repository.
#
# No plugin here writes to flash: values are only kept in memory and served
# to Prometheus by write_prometheus.

FQDNLookup false
Interval 10

LoadPlugin syslog
<Plugin syslog>
	LogLevel info
</Plugin>

LoadPlugin cpu
LoadPlugin load
LoadPlugin memory
LoadPlugin uptime

LoadPlugin interface
<Plugin interface>
	Interface "lo"
	Interface "sit0"
	Interface "ip6tnl0"
	IgnoreSelected true
</Plugin>

LoadPlugin df
<Plugin df>
	MountPoint "/"
	MountPoint "/mnt/sdcard"
</Plugin>

# NAND wear: bad eraseblock count and maximum erase counter.
# Without a Device selection the plugin also tries the volume entries in
# /sys/class/ubi and logs an error for each of them on every read.
LoadPlugin ubi
<Plugin ubi>
	Device "/^ubi[0-9]+$/"
</Plugin>

# SoC temperature (thermal_zone0) and fan cooling level (cooling_device0).
LoadPlugin thermal

# Everything lm-sensors can see: SoC temperature, and fan RPM on boards with
# an EMC2301.
LoadPlugin sensors

# Prometheus scrape endpoint: http://<bmc>:9103/metrics
# It is unauthenticated. Add 'Host "<address>"' to bind it to one address.
LoadPlugin write_prometheus
<Plugin write_prometheus>
	Port "9103"
</Plugin>
